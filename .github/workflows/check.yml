name: check
on: [push, pull_request]
# gitleaks-action は PR のとき PR のコミット一覧を API で読むので pull-requests: read が要る
permissions:
  contents: read
  pull-requests: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash -n tg_send.sh
      - run: python -m py_compile claude_button_url.py
      - run: python tests/test_tg_send.py
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
